# Sensitive-object rules (spec 7.4). Conservative starting lists: audit them against real records (gate step 3).
# Terms use the classifier's token rules (either end of a compound); phrases match whole.

# Sentences containing one of these become the reply's provenance note and are cut last. They never block a post.
provenance_flags: [punitive expedition, looted, loot, seized, confiscated, restitution, claim, raubgut, beute, strafexpedition]

# Matched in title, object type, description and provenance. The museum's own wording, not our inference.
blocked_terms: [and mummy, mummy of, mummified, human remains, skeletal remains, human bone, menschliche überreste, menschliche knochen, momie de, et momie, momifi, restes humains, ossements humains, gender-restricted, secret/sacred, sacred/secret, restricted viewing, not for public display, culturally sensitive]

# Matched as whole tokens of the object type only, so "Mumienmaske" (a mask) is not caught.
blocked_type_tokens: [mummy, mumie, momie, skull, schädel, crâne, skeleton, skelett, squelette, bone, knochen]

# Photographs (owner, 2026-10-14): a photograph of an object may be posted, one with a real person in it never. A record whose object
# type or medium (the museum's own wording, not the description) names one of these is a photograph; src/people.ts then asks a
# vision model whether a real person is visible, and the post is refused unless the answer is a clear "none" (no key = refused).
# Same token rules as blocked_terms.
photograph_terms: [photo, fotografie, foto, daguerreotype, ambrotype, tintype, cyanotype, "silver print", "albumen print", "salt print", "platinum print", "carbon print", chromogenic, "inkjet print", "pigment print", c-print, polaroid, "glass negative", "film negative", "lantern slide", stereograph, "épreuve argentique", "tirage argentique"]

# Phrases that contain a blocked word but are not remains: removed from the text before the checks above (owner, 2026-10-08:
# human remains and bodies are never posted; a label tied to a mummy is a tag, not a body).
allowed_phrases: [étiquette de momie, etiquette de momie, mummy label]

# Modern materials (owner, 2026-10-14): an object whose material or title names one of these is never posted (a 2007 Ijele mask
# with plastic and synthetic cloth got through). Matched in the medium and title only, with the classifier's token rules:
# "plastik" is left out because German "Plastik" means sculpture, and descriptions are skipped because "plastic" also
# appears there as an art-historical adjective ("plastic modelling").
modern_material_terms: [kunststoff, kunstharz, kunstfaser, styropor, styrofoam, polystyrene, polystyrol, polyester, polyurethane, polyurethan, nylon, acrylic, acryl, plexiglas, perspex, vinyl, pvc, lycra, synthetic, synthetisch, synthétique, plastic, "matière plastique", plastique]

# Never post an object whose date text points entirely after this year (owner, 2026-10-14: 1956). Only 4-digit years are read:
# the earliest one must be later than this. BCE dates, and dates that also name a century, are not judged.
latest_year: 1956

# Manual overrides, e.g. "met:12345".
blocked_keys: []
