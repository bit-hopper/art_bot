# Sensitive-object rules (spec 7.4). Conservative starting lists: audit them against real records (gate step 3).
# Terms use the classifier's token rules (either end of a compound); phrases match whole.

# Sentences containing one of these become the reply's provenance note and are cut last. They never block a post.
provenance_flags: [punitive expedition, looted, loot, seized, confiscated, restitution, claim, raubgut, beute, strafexpedition]

# Matched in title, object type, description and provenance. The museum's own wording, not our inference.
blocked_terms: [and mummy, mummy of, mummified, human remains, skeletal remains, human bone, menschliche überreste, menschliche knochen, momie de, et momie, momifi, restes humains, ossements humains, gender-restricted, secret/sacred, sacred/secret, restricted viewing, not for public display, culturally sensitive]

# Matched as whole tokens of the object type only, so "Mumienmaske" (a mask) is not caught.
blocked_type_tokens: [mummy, mumie, momie, skull, schädel, crâne, skeleton, skelett, squelette, bone, knochen]

# Photographs (owner, 2026-10-14): a photograph of an object may be posted, one with a real person in it never. A record whose object
# type or medium (the museum's own wording, not the description) names one of these is a photograph; src/people.ts then asks a
# vision model whether a real person is visible, and the post is refused unless the answer is a clear "none" (no key = refused).
# Same token rules as blocked_terms.
photograph_terms: [photo, fotografie, foto, daguerreotype, ambrotype, tintype, cyanotype, "silver print", "albumen print", "salt print", "platinum print", "carbon print", chromogenic, "inkjet print", "pigment print", c-print, polaroid, "glass negative", "film negative", "lantern slide", stereograph, "épreuve argentique", "tirage argentique"]

# Phrases that contain a blocked word but are not remains: removed from the text before the checks above (owner, 2026-10-08:
# human remains and bodies are never posted; a label tied to a mummy is a tag, not a body).
allowed_phrases: [étiquette de momie, etiquette de momie, mummy label]

# Modern materials (owner, 2026-10-14): an object whose material or title names one of these is never posted (a 2007 Ijele mask
# with plastic and synthetic cloth got through). Matched in the medium and title only, with the classifier's token rules:
# "plastik" is left out because German "Plastik" means sculpture, and descriptions are skipped because "plastic" also
# appears there as an art-historical adjective ("plastic modelling").
modern_material_terms: [kunststoff, kunstharz, kunstfaser, styropor, styrofoam, polystyrene, polystyrol, polyester, polyurethane, polyurethan, nylon, acrylic, acryl, plexiglas, perspex, vinyl, pvc, lycra, synthetic, synthetisch, synthétique, plastic, "matière plastique", plastique]

# Explicit sexual content (owner, 2026-11-05: the bot posted phallic figures). Two lists, both with the classifier's token rules
# ("ithyphallic" is caught by "phallic", "Penisfutteral" by "penis"), both on the museum's own wording only.
# explicit_terms: title, type, medium, description and provenance. The Louvre describes figures as "phallus dresse".
explicit_terms: [phallus, phallic, phallique, phallisch, phallos, priap]
# explicit_title_terms: title, type and medium only, because descriptions use these words in scholarly prose (a Bwa mask note
# on a "circumcised penis", an SMB statue with "erotischer Ausstrahlung") and those objects are fine.
explicit_title_terms: [penis, pénis, genital, génital, geschlechtsteil, "sexual organ", erotic, erotique, érotique, erotisch, erotik, ejaculat, "sexual intercourse", geschlechtsverkehr, "rapport sexuel"]

# Sensitive media (owner, 2026-11-09: a Benin plaque of "three unclothed young men" went out unlabelled). Not a block: the post goes
# out with the Bluesky "nudity" self-label, which blurs the image behind a click for people who filter it. Title, type, medium and
# description, the museum's own wording, with the classifier's token rules. Kept to plain nudity words; "breasts" is left out
# because it describes most female figures. Edit freely: the list is the whole rule.
sensitive_nudity_terms: [nude, nudity, naked, unclothed, undressed, bare-breasted, topless, nackt, nackte, nackten, nackter, nacktheit, unbekleidet, unbekleidete, unbekleideten, unbekleideter, entblößt, nudité, dénudé, "seins nus", "torse nu"]

# Condition (owner, 2026-11-05: a heavily corroded, encrusted Osiris bronze was posted). Title, type, medium and description,
# the museum's own wording. Only words that say the object itself is corroded or crusted over; "patina" is left out because a
# green patina on a clean bronze is normal. The image check in src/condition.ts covers records that say nothing.
condition_image_threshold: 0.6    # calibrated 2026-11-05 on the 582 posted images: flags about 1 in 10, mostly SMB colour-chart shots, fragments, ostraca and encrusted bronzes
condition_fail_closed_sources: [louvre, smb, met]   # owner 2026-11-06: corroded bronzes come from these; if the model cannot run, refuse the pick (the next hour retries) rather than post unchecked
condition_terms: [corroded, corrosion, encrusted, encrustation, concretion, korrodiert, korrosion, verkrustet, verkrustung, corrodé, corrodée, incrusté, incrustée, concrétion, oxydé]

# Human hair (owner, 2026-11-12: smb:223559, a Bafo "menschlicher Kopf" that "looks like a corpse"; "no human hair"). Supersedes the
# 2026-11-0x ruling that hair as a decorative material was fine. Blocked whenever the medium or title names human hair, museum wording in
# the original language (the check runs before translation). Plain "hair", "Haar" or animal hair is untouched. The look of the object
# (teeth, a realistic face) is judged by the image check below, not by these words: a boar mask with teeth (smb Yoruba "Maske") must stay.
human_hair_terms: ["haar (menschlich)", "haar (mensch)", "haare (menschlich)", "menschenhaar", "menschenhaare", "menschliches haar", "menschliche haare", "haar, menschlich", "human hair", "hair (human)", "hair, human", "cheveux humains", "cheveu humain", "cheveux (humains)"]

# Image check for a corpse-like or horror-prop look (owner 2026-11-12: "looks like a corpse"; it must pass the boar mask smb Yoruba "Maske", 3mzqwg7yed424, which scores 0.005). Local CLIP, fails open. 0.08 sits between the target
# (0.10 full photo, 0.099 crop, 0.086 thumbnail) and the highest of 49 other posts (a scarab, 0.074). Tune on more examples; 0 turns it off.
uncanny_image_threshold: 0.08

# Never post an object whose date text points entirely after this year (owner, 2026-10-14: 1956). Only 4-digit years are read:
# the earliest one must be later than this. BCE dates, and dates that also name a century, are not judged.
latest_year: 1956
# Owner 2026-11-05: the Edo brass casters of Benin City still work in the lost-wax tradition, and their new work (AIC 197666, a
# leopard-head container made 2000-2008, a gift from the Oba of Benin) is exactly what the feed wants. Edo/Benin culture and a
# brass or bronze medium skip the date rule above. The modern-material rule still applies to them.
latest_year_exempt: { culture_terms: [edo, ẹdo, benin], medium_terms: [brass, bronze, messing, laiton] }

# Manual overrides, e.g. "met:12345".
#   met:564545 Min figurine (ithyphallic god, owner 2026-11-05); louvre:cl010374365 encrusted Osiris bronze (no wording or image rule catches it).
blocked_keys: ["met:564545", "louvre:cl010374365"]
