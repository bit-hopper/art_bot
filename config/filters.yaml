# Filter profiles (spec 4). The default profile includes Egypt as Africana.
profiles:
  africana-masks-and-sculpture:
    enabled: true
    region_share_caps:        # max fraction of the last 24 posts
      egypt: 0.58
    require_image: true
    # Owner 2026-11-05: more objects that awe (whole decorated pottery, cast Benin works), fewer small Egyptian pieces that are
    # mostly corroded or remains of something larger. Applied when a post is picked; the material rules read the `medium` each index row carries.
    taste:
      class_boost: { pottery: 2, other: 0.5 }
      culture_boost: { terms: [edo, ẹdo, benin, ife], factor: 12 }   # 776 tagged rows (SMB's Benin works included): about 14% of draws at 8, about 19% at 12
      material:                 # owner 2026-11-05: refined taste (cast brass, carved ivory and stone); a bellows of fur, leather and raffia is not what the feed is for
        boost: 2                # a row whose index medium names one of boost_terms is drawn twice as often
        boost_terms: [brass, bronze, messing, copper, kupfer, gold, silver, silber, ivory, elfenbein, marble, marmor, quartzite, quarzit, granite, granit, limestone, kalkstein, sandstone, sandstein, alabaster, ebony, ebenholz, stone, stein]
        organic: 0.25           # class `other` only: a medium naming one of organic_terms (and no boost term) is drawn a quarter as often
        organic_terms: [fur, pelt, hide, skin, leather, raffia, fell, leder, haut, fibre, fiber, grass, gras, pflanzenfaser, cloth, textile, textil, cotton, baumwolle, linen, leinen, stoff, raphia, rafia, palmfaser, kürbis, kürbisschale, gourd, kalebasse, calabash, papyrus, pergament, parchment]
      catch_all:                # after the fetch, class `other` only, from the record's own medium
        organic_accept: 0.2     # a medium naming one of material.organic_terms is kept 1 time in 5
        unrefined_accept: 0.5   # ...otherwise, a medium naming none of refined_terms is kept 1 time in 2
        refined_terms: [brass, bronze, messing, bronzen, copper, kupfer, gold, silver, silber, ivory, elfenbein, stone, stein, marble, marmor, quartzite, granite, granit, limestone, sandstone, alabaster, terracotta, ceramic, pottery, keramik, ton, glass, glas, faience, fayence, ebony, ebenholz]
      low_interest:
        accept: 0.25            # a record that matches is kept 1 time in 4
        max_rejects: 12
        terms: [fragment, bruchstück, sherd, scherbe, tesson]
        egypt_terms: [amulet, amulette, amulett, scarab, scarabée, skarabäus, figurine, shabti, ushabti, uschebti, oushebti, ouchebti, chaouabti, serviteur, ostrac, ostrak, stopper, bouchon, "seal impression", empreinte, sealing, bead, perle]
      high_interest:            # Egypt only: royal heads, statues, coffins, stelae and reliefs are always kept, other Egyptian objects (not pottery or masks) 3 times in 5
        other_accept: 0.6
        terms: [head, kopf, tête, bust, büste, buste, statue, coffin, sarcophagus, sarkophag, cercueil, sarcophage, stela, stele, stèle, relief, sphinx, naos]
    force_mask_after_hours: 23   # owner 2026-10-14: at least one mask in every 24 hours (23 leaves room for a missed hour)
    classes:                  # object_class -> weight
      mask: 100
      sculpture: 90
      carved-instrument: 70
      pottery: 60               # pottery and other vessels (owner 2026-10-10): jars, bowls, vases, lamps, flasks
      other-carved-cast: 40
      other: 10
      specimen: 0             # natural-history reference objects; never posted
      archive: 0              # photographs, slides, sound recordings; never posted
    # Matching is on word tokens, at either end of a German compound ("Mumienmaske", "Blashorn"),
    # with plurals folded. Entries containing a space are matched as phrases.
    # Check order: archive -> specimen -> mask (unless not_mask) -> carved-instrument -> other-carved-cast (carved, cast or smelted: also metalwork, weapons, armor, coins)
    #              -> sculpture -> pottery -> other. Bells (glocke) are not carved and stay `other`.
    keywords:
      archive: [positiv, negativ, dia, schellackplatte, schallplatte, tonband, walze, walzensammlung, postkarte, cd, kassette, film, foto, fotografie, abzug, glasplatte]   # first word of the object type only
      specimen: [xylarium, "wood sample", "echantillon de bois", herbarium, "botanical specimen", holzprobe, xylothek, herbar]
      mask: [mask, masque, maske, helmmaske, aufsatzmaske, gesichtsmaske, kopfaufsatz, "face mask"]
      not_mask: [gewand, klapper, rassel]
      carved-instrument: [drum, tambour, trommel, schlitztrommel, "slit drum", "tambour à fente", lamellophone, lamellophon, zupfidiophon,sanza, sansa, mbira, xylophone, xylophon, harp, harpe, harfe, horn, trompe, trompete, zither, cithare, laute, leier, flöte, rassel, "musical instrument", musikinstrument]
      other-carved-cast: [hocker, stuhl, stab, szepter, zepter, löffel, kamm, kopfstütze, tür, pfosten, dose, behälter, tabakpfeife, pfeifenkopf, tabouret, sceptre, bâton, cuillère, peigne, appui-tête, boîte, étui, headrest, neckrest, "head rest", "neck rest", tapper, münze, coin, monnaie, jewelry, jewellery, amulet, amulett, scarab, skarabäus, necklace, bracelet, pendant, earring, anklet, armlet, fibula, fibel, schmuck, armreif, perle, perlen, anhänger, halskette, armband, ohrring, fingerring, armring, halsring, siegelring, "finger ring", "signet ring", bijou, collier, bague,seal, siegel, sceau, dagger, sword, spear, lance, knife, blade, axe, shield, helmet, armor, armour, cuirass, scabbard, sheath, knobkerrie, "arms and armor", dolch, schwert, speer, lanze, messer, klinge, axt, beil, schild, helm, rüstung, panzer, épée, poignard, bouclier, casque, couteau, lance]   # metalwork and weapons/armor: owner 2026-10-09 ("smelted"); coins too; seals (stamp, cylinder, scaraboid) 2026-10-10   # French (Louvre); "vase" and "bol" left out: "vase" is English too and "symbol" ends in "bol"
      pottery: [vessel, amphora, juglet, flask, beaker, pitcher, krater, kylix, pyxis, ceramic, pottery, potsherd, sherd, keramik, gefäß, schale, becher, céramique, poterie, jarre, coupe, unguent, "water filter"]   # vessels and ceramics; German/French as for the Staatliche Museen and the Louvre
      pottery_whole_word: [jar, pot, bowl, vase, cup, jug, dish, bottle, plate, lamp, urn, ewer, bol, lampe]   # whole words only (plural folded): "pot" must not match "potential"

      sculpture: [figure, figurine, statue, statuette, sculpture, skulptur, figur, bust, büste, plastik, puppe, "power figure", reliquary, reliquiar, effigy, relief, shabti, ushabti, uschebti, stela, stele, sphinx, canopic, coffin, sarcophagus, sarkophag, "ka statue", serviteur, oushebti, ouchebti, chaouabti, stèle, sarcophage, cercueil, naos, canope]   # shabti onward: Egyptian vocabulary (spec 4); serviteur onward: French (Louvre, "serviteur funéraire" = shabti)
      sculpture_whole_word: [kopf, head, tête]   # only as a standalone word, never inside "Tabakpfeifenkopf"
    exclude_keywords: [sealing]   # clay sealings are impressions, not seals
