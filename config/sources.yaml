# Per-source switches and settings (spec 3, 5.2, 9). `enabled: false` is the per-source kill switch.
sources:
  smb:
    enabled: true
    kind: scrape
    rights_mode: attributed-nc     # owner decision 2026-10-08: post each image under its own licence
    source_weight: 2.0             # largest collection; tune once real posting data exists (spec 5.2)
    min_interval_ms: 1000          # <= 1 request per second (spec 7.3)
    # The portal's geography filter is a term match with no continent hierarchy, so Africa is enumerated
    # country by country and unioned by id (spike result 2026-10-08).
    org_units_africa: ["Ethnologisches Museum"]
    org_units_egypt: ["Ägyptisches Museum und Papyrussammlung"]
    # Origin rule (owner 2026-10-09): units filed by period. Kept when every place of origin the record names is African
    # (find-spots and purchase places are ignored); "Ägypten" + "Syrien" is "Egypt or Syria" and is out. Measured 2026-10-09:
    # Islamic Art 2,025 hits for African terms (2,019 Ägypten, many also Syrien), Byzantine 294, Antikensammlung 0.
    org_units_origin: ["Museum für Islamische Kunst", "Skulpturensammlung und Museum für Byzantinische Kunst", "Antikensammlung", "Münzkabinett"]
    origin_egypt_places: [Fustat, Fostat, Kairo, Alexandria, Alexandrien, Assuan, Luxor, Theben, Memphis, Fayum, Oxyrhynchos, Achmim, Antinoë, Sakkara, Giza, Abydos, Amarna, Tanis, Bahnasa]
    origin_exclude_terms: [Makedonien, Thrakien, Kleinasien, Phönizien, Kreta, Rom, Frankreich, Deutschland, Syrien, Irak, Iran, Libanon, Jordanien, Israel, Palästinensische Gebiete, Türkei, Spanien, Zypern, Griechenland, Italien, Sizilien, Mesopotamien, Persien, Arabien, Jemen, Saudi-Arabien, Usbekistan, Indien, Afghanistan, Pakistan, Armenien, Georgien, Russland]
    africa_terms: [Afrika, Algerien, Angola, Äquatorialguinea, Äthiopien, Benin, Botswana, Burkina Faso, Burundi, Dschibuti, Elfenbeinküste, Eritrea, Eswatini, Swasiland, Gabun, Gambia, Ghana, Guinea, Guinea-Bissau, Kamerun, Kap Verde, Kenia, Komoren, Kongo, Zaire, Lesotho, Liberia, Libyen, Madagaskar, Malawi, Mali, Marokko, Mauretanien, Mauritius, Mosambik, Namibia, Niger, Nigeria, Ruanda, Sambia, Senegal, Seychellen, Sierra Leone, Simbabwe, Somalia, Südafrika, Südsudan, Sudan, Tansania, Togo, Tschad, Tunesien, Uganda, Zentralafrikanische Republik, Sao Tomé, Sansibar, Westsahara, Obervolta, Dahomey, Deutsch-Ostafrika, Deutsch-Südwestafrika, Rhodesien, Belgisch-Kongo, Nubien, Abessinien, Ägypten]
    # region_group mapping for Ethnologisches Museum records, from the country term that matched (spec 4).
    # The Egyptian Museum is always `egypt`. Anything else that matched a country is `sub-saharan`; objects found
    # only through the generic "Afrika" term are `unspecified-africa`.
    egypt_terms: [Ägypten]
    north_africa_terms: [Algerien, Libyen, Marokko, Tunesien, Westsahara]
    # Licences that may be posted. Anything else, or no licence at all, is `blocked`.
    allowed_licenses:
      open: ["Public Domain Mark 1.0", "CC0 1.0"]
      attributed: ["CC BY-SA 4.0", "CC BY-SA 3.0", "CC BY 4.0"]
      attributed-nc: ["CC BY-NC-SA 4.0", "CC BY-NC 4.0", "CC BY-NC-ND 4.0"]
  # Index rows for the four API sources carry class, region and culture straight from the museum's own fields.
  # `rights_mode` says how a typical object is credited; each record's rights are still read per object (spec 7.1).
  met:
    enabled: true
    kind: api
    rights_mode: open
    source_weight: 1.0
    # The API documents 80 req/s, but the Met's WAF (Incapsula) answers 403 well below that. Measured 2026-10-08 from one
    # IP: blocked after ~60 requests at 2 req/s and after fewer at 4-30 req/s; 100 requests at 1 req/s passed.
    min_interval_ms: 1100
    concurrency: 1
    # Objects are fetched once and cached (type + image availability), so only new ids cost requests. This caps one run;
    # the first full index (~17,000 objects) therefore fills over several daily runs, Africa department first.
    max_new_per_run: 3000
    # `isPublicDomain=true` in the search is ignored by the API; image availability is read from each record.
    departments:
      - { id: 5, geo_location: Africa, egypt: false }    # also holds non-African objects: geoLocation=Africa is required
      - { id: 10, geo_location: null, egypt: true }
      # Origin rule (owner 2026-10-08): objects made in Africa under Greek, Roman, Byzantine, Coptic or Islamic rule, filed
      # by period in other departments. The search matches any African place, so each record must state an African origin.
      - { id: 13, geo_location: Africa, egypt: false, origin_check: true }    # Greek and Roman Art (114 hits for Egypt)
      - { id: 14, geo_location: Africa, egypt: false, origin_check: true }    # Islamic Art (~3,800: Egypt, Morocco, Algeria, Tunisia)
      - { id: 17, geo_location: Africa, egypt: false, origin_check: true }    # Medieval Art incl. Byzantine and Coptic (35)
      # Owner 2026-10-09: Egyptian or African origin *or influence* is wanted: everything the Met files under an Egyptian
      # place (Egyptian seals, but also Achaemenid and Sasanian pieces recorded as Egypt). Owner 2026-10-10: origin check on,
      # so "Egypt or Levant" is out; any one African field (country, culture or region) still qualifies the record.
      # Owner 2026-10-09: smelted metalwork counts, so weapons and armor are in; the record must state an African origin.
      - { id: 1, geo_location: Africa, egypt: false, origin_check: true }     # Arms and Armor
      - { id: 3, geo_location: Egypt, egypt: false, origin_check: true }                        # Ancient West Asian Art (26)
    # Depictions of Africans and African-sourced work that no field marks (owner 2026-10-09); add ids as they are found.
    extra_objects:
      - { id: 325089, region_group: unspecified-africa }   # Neo-Assyrian ivory, Nimrud: man with an oryx, a monkey and a leopard skin
  cleveland:
    enabled: true
    kind: api
    rights_mode: open
    source_weight: 1.0
    min_interval_ms: 250
    departments: ["African Art"]
    # Also holds Near Eastern works: keep only records whose culture mentions one of the terms.
    egypt_departments: ["Egyptian and Ancient Near Eastern Art"]
    egypt_culture_terms: [Egypt, Egyptian, Nubia, Nubian, Kush]
    # Origin rule (owner 2026-10-09): works made in Africa but filed by period. Kept when `culture` names an African origin and
    # no non-African alternative ("Egypt or Syria" is out). Survey 2026-10-09: Textiles 390, Islamic 31, Medieval 19, Greek and Roman 9.
    origin_departments: ["Medieval Art", "Islamic Art", "Greek and Roman Art", "Textiles"]
  aic:
    enabled: true
    kind: api
    rights_mode: open
    source_weight: 1.0
    min_interval_ms: 1100          # anonymous limit 60 req/min
    departments: ["Arts of Africa"]    # already includes Egyptian objects
  mia:
    enabled: true
    kind: api
    rights_mode: open
    source_weight: 1.0
    min_interval_ms: 500
    timeout_ms: 30000              # about 1 call in 15 timed out at 19 s (M0)
    retries: 3
    query: "continent:Africa"      # Egypt is inside continent:Africa; no rights filter (spec 7.1)
  louvre:
    enabled: true                  # owner 2026-10-10; the index fills over several runs (probe_stride below), posts use what is indexed
    kind: scrape
    rights_mode: attributed        # owner 2026-10-08: educational use falls under the terms' teaching use; credit + permalink are its only condition
    source_weight: 1.0
    min_interval_ms: 1100          # <= 1 request per second (spec 7.3); the JSON endpoint answered 100 of 100 at 1.1 s (2026-10-08)
    # Egyptian Antiquities only (the Louvre's African art went to the Quai Branly). The department is not in the sitemap, so
    # every object under these ark prefixes is fetched once and cached; the first full index fills over several daily runs.
    egypt_collections: ["Département des Antiquités égyptiennes"]
    # Origin rule (owner 2026-10-09): African-made work under Greek, Roman, Phoenician/Punic (Carthage), Byzantine or Islamic
    # rule sits in the other antiquities departments; kept only when `placeOfCreation` is African (find-spots are ignored).
    # The European-art departments (Paintings, Sculptures, Objets d'art) are out: a European painter's work made in
    # Africa is not African-made by origin.
    origin_collections:
      - "Département des Antiquités grecques, étrusques et romaines"
      - "Département des Antiquités orientales"
      - "Département des Arts de l'Islam"
      - "Département des Arts de Byzance et des chrétientés en Orient"
    ark_prefixes: ["cl01"]         # cl02 is prints and drawings (0 of 21 Egyptian in the 2026-10-08 sample)
    max_new_per_run: 12000         # ~3.7 h at 1.1 s; the daily workflow allows 340 min
    # Departments sit in long runs of consecutive ids (sampled 2026-10-10: Egyptian ids ~0-54k and again ~340k+, Oriental,
    # Greek/Roman, Paintings in between). Every 100th id is fetched first; stretches between two probes of the same
    # unwanted department are skipped.
    probe_stride: 100
    # Egyptian stretches only (~57k ids, ~89% postable). The origin-rule departments are 154k more ids at ~0.7% yield
    # (11 of 1,563, 2026-10-10); the probes still index any African-made object they land on. Set true to crawl them.
    crawl_origin_stretches: false
    exclude_terms: [fragment]      # owner 2026-10-08: no fragments (checked on every denomination, not only the title)
  nmafa:
    enabled: true                  # audit passed 2026-10-09 (111 rows read, see spec 0)
    kind: api
    rights_mode: open
    source_weight: 1.0
    min_interval_ms: 100
    # Smithsonian Open Access bulk copy on AWS: public, no key. Only CC0 records are in it (113 on 2026-10-09, all with an
    # image, 78 sculpture/figure/mask); the museum's full catalogue needs the EDAN API and a key, which we do not use.
    bulk_url: "https://smithsonian-open-access.s3.amazonaws.com/metadata/edan/nmafa"
    shards: 256                    # NN.txt for NN = 00..ff; about 94 are non-empty
    # Origin rule (owner 2026-10-08): a place field naming one of these means made outside Africa -> blocked.
    non_african_places: [Austria, Germany, France, Italy, England, United Kingdom, Netherlands, Belgium, Portugal, Spain, Denmark, Sweden, Switzerland, Czech Republic, Czechoslovakia, United States, India, China, Indonesia, Turkey]
